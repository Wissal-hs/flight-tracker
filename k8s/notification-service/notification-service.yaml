apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-db
  namespace: gestion-vols
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-db
  template:
    metadata:
      labels:
        app: notification-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: notification_db
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: notification-db
  namespace: gestion-vols
spec:
  selector:
    app: notification-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: gestion-vols
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: 522161234005.dkr.ecr.eu-west-3.amazonaws.com/notification-service:latest
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@notification-db:5432/notification_db
          ports:
            - containerPort: 8003
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: gestion-vols
spec:
  type: NodePort
  selector:
    app: notification-service
  ports:
    - port: 8003
      targetPort: 8003
      nodePort: 30803
