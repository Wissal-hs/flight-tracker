apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-db
  namespace: gestion-vols
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking-db
  template:
    metadata:
      labels:
        app: booking-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: booking_db
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: booking-db
  namespace: gestion-vols
spec:
  selector:
    app: booking-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: gestion-vols
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      containers:
        - name: booking-service
          image: 522161234005.dkr.ecr.eu-west-3.amazonaws.com/booking-service:latest
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@booking-db:5432/booking_db
          ports:
            - containerPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: gestion-vols
spec:
  type: NodePort
  selector:
    app: booking-service
  ports:
    - port: 8001
      targetPort: 8001
      nodePort: 30801
