apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-db
  namespace: gestion-vols
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-db
  template:
    metadata:
      labels:
        app: auth-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: auth_db
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: auth-db
  namespace: gestion-vols
spec:
  selector:
    app: auth-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: gestion-vols
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: 522161234005.dkr.ecr.eu-west-3.amazonaws.com/auth-service:latest
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@auth-db:5432/auth_db
            - name: SECRET_KEY
              value: cle-secrete-a-changer-en-production
          ports:
            - containerPort: 8002
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: gestion-vols
spec:
  type: NodePort
  selector:
    app: auth-service
  ports:
    - port: 8002
      targetPort: 8002
      nodePort: 30802
