
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: 522161234005.dkr.ecr.eu-west-3.amazonaws.com/notification-service:latest
          ports:
            - containerPort: 8003
          env:
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@db:5432/notification_db
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector:
    app: notification-service
  ports:
    - port: 8003
      targetPort: 8003
  type: ClusterIP