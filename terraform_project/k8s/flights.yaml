apiVersion: apps/v1
kind: Deployment
metadata:
  name: flights-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flights-service
  template:
    metadata:
      labels:
        app: flights-service
    spec:
      containers:
        - name: flights-service
          image: 522161234005.dkr.ecr.eu-west-3.amazonaws.com/flights-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@db:5432/flights_db
---
apiVersion: v1
kind: Service
metadata:
  name: flights-service
spec:
  selector:
    app: flights-service
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP